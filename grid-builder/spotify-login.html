<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connect Spotify | MusicGrid</title>
  <meta name="description" content="Connect Spotify to build a MusicGrid from your top artists.">
  <meta name="theme-color" content="#1e44b5">
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" href="/fonts/archivo-latin.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/css/mg.css?v=2026102706">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/img/logo.svg" width="32" height="32" alt=""><span>MusicGrid</span></a>
    <nav class="topnav" aria-label="Main">
      <a href="/">Today</a>
      <a href="/browse">Browse</a>
      <a href="/grid-builder/" aria-current="page">Build</a>
      <a href="/stats">Stats</a>
    </nav>
  </header>

  <main class="builder" id="main-wrap">
    <ol class="steps" aria-label="Progress">
      <li class="now"><span class="num">1</span>Connect Spotify</li>
      <li><span class="num">2</span>Build your grid</li>
    </ol>
    <div id="main">
      <div class="card"><p class="lede" style="margin:0">Checking your Spotify connection…</p></div>
    </div>

    <template id="login">
      <h1 class="title">Connect Spotify</h1>
      <p class="subtitle">We'll look at your top artists and find three that make a good grid together.</p>
      <div class="card" style="margin-top: 24px">
        <p class="notice" hidden></p>
        <button class="btn" id="login-button" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7 9.6c3.3-1 7-.7 10 1M7.6 12.7c2.7-.8 5.6-.5 8 .9M8.3 15.5c2.1-.6 4.3-.4 6.2.7" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linecap="round"/></svg>Connect Spotify</button>
        <p class="fine">Sign-in uses Spotify's PKCE flow, and MusicGrid only asks to see your top artists. You can disconnect any time.</p>
      </div>
    </template>

    <template id="working">
      <h1 class="title">Connecting…</h1>
      <div class="card" style="margin-top: 24px"><p class="lede" style="margin:0">Finishing up with Spotify.</p></div>
    </template>

    <template id="logged-in-template">
      <h1 class="title">You're connected</h1>
      <p class="subtitle">Next, pick a listening window and rank your artists.</p>
      <div class="card" style="margin-top: 24px">
        <div class="account">
          <img data-slot="avatar" alt="" width="56" height="56">
          <div><span>Connected as</span><b data-slot="name"></b></div>
        </div>
        <div class="row-actions">
          <a class="btn" href="/grid-builder/artist-selection" id="proceed-button">Continue to step 2</a>
          <button class="text-btn" type="button" id="logout-button">Use a different account</button>
        </div>
      </div>
    </template>
  </main>

  <footer class="foot">
    MusicGrid is made by <a href="https://www.stevenhester.com">Steven Hester</a>. Song data from Spotify.
  </footer>
  <script src="/js/gb-spotifyLogin.js?v=2026102706" type="module"></script>
</body>
</html>
